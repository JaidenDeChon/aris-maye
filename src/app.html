<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
        <link
            rel="apple-touch-icon-precomposed"
            sizes="180x180"
            href="%sveltekit.assets%/apple-touch-icon-precomposed.png"
        />
        <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <script>
            // One-time migration from the old `ge-skiller-*` localStorage key prefix to
            // `aris-maye-*` (app rename), run before any app code reads these keys.
            (function () {
                try {
                    var renamedKeys = {
                        'ge-skiller-filter-items-by-player-skills':
                            'aris-maye-filter-items-by-player-skills',
                        'ge-skiller-favorites': 'aris-maye-favorites',
                        'ge-skiller-hidden': 'aris-maye-hidden',
                        'ge-skiller-characters': 'aris-maye-characters',
                        'ge-skiller-recent-searches': 'aris-maye-recent-searches',
                        'ge-skiller-items-page-preferences': 'aris-maye-items-page-preferences',
                        'ge-skiller-bank-items': 'aris-maye-bank-items',
                    };
                    for (var oldKey in renamedKeys) {
                        var newKey = renamedKeys[oldKey];
                        var oldValue = localStorage.getItem(oldKey);
                        if (oldValue === null) continue;
                        if (localStorage.getItem(newKey) === null) {
                            localStorage.setItem(newKey, oldValue);
                        }
                        localStorage.removeItem(oldKey);
                    }
                } catch (e) {
                    // localStorage unavailable (e.g. disabled/private mode); nothing to migrate.
                }
            })();
        </script>

        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
